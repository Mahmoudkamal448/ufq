# Run the UFQ website:
#   cp .env.example .env      # then set ADMIN_PASSWORD in .env
#   docker compose up -d --build
# Site:  http://localhost:3000        Admin: http://localhost:3000/admin/

name: ufq-website

services:
  web:
    build: .
    # Always rebuild from the current code on "docker compose up", so a
    # "git pull" is never ignored because an older image already exists.
    pull_policy: build
    image: ufq:latest
    container_name: ufq-website
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Uploaded certificates and videos are kept here, so they survive
      # restarts and image updates. Back this up!
      - ufq-data:/data

volumes:
  ufq-data:
